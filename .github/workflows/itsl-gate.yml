# ITSL gate: the single required status check (`gate`) for this repo.
# This repo has no code to build or test yet, so the gate is gitleaks only.

name: ITSL gate

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: itsl-gate-${{ github.ref }}
  # Cancel superseded runs on PRs only: on main, cancelling would leave an
  # intermediate merge commit unverified (a cancelled check reads as never ran).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub secret scanning is a paid add-on on private repos and gitleaks-action
  # needs a licence for organisations, so the open-source gitleaks binary is
  # used instead, pinned by SHA-256. Reviewed false positives live in
  # .gitleaksignore as exact fingerprints; never allow a whole rule or path.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks and verify its SHA-256
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: gitleaks (full history)
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1'

  gate:
    if: always()
    needs: [gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All gate jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          [ "$(echo "$RESULTS" | jq -r 'length > 0 and all(. == "success")')" = "true" ]
